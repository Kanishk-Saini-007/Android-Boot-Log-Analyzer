name: Collect real emulator boot logs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and collect boot logs via ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            date -u > build_info.txt
            adb shell getprop ro.product.model >> build_info.txt
            adb shell getprop ro.build.version.release >> build_info.txt
            adb shell getprop ro.build.fingerprint >> build_info.txt
            adb root
            sleep 5
            adb wait-for-device
            adb shell dmesg > real_boot_dmesg.log
            adb logcat -b all -d -v threadtime > real_boot_logcat.log
            wc -l real_boot_dmesg.log real_boot_logcat.log

      - name: Run analyzer on the real logs
        run: |
          python3 -m bootlog_analyzer real_boot_logcat.log --json real_logcat_report.json --html real_logcat_report.html
          python3 -m bootlog_analyzer real_boot_dmesg.log --json real_dmesg_report.json --html real_dmesg_report.html

      - name: Scan logs for identifiers
        run: |
          set +e
          matches=$(grep -nEi '([0-9a-f]{2}:){5}[0-9a-f]{2}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|imei|serialno|password|bearer [A-Za-z0-9._-]+' real_boot_dmesg.log real_boot_logcat.log | grep -v '02:00:00:00:00:00' | grep -v '52:54:00:12:34:56' | head -20)
          if [ -n "$matches" ]; then
            echo "POTENTIAL IDENTIFIERS FOUND - refusing to commit:"
            echo "$matches"
            exit 1
          fi
          echo "identifier scan clean"

      - name: Commit real logs and reports
        run: |
          mkdir -p sample_logs/real_emulator
          cp real_boot_dmesg.log real_boot_logcat.log build_info.txt sample_logs/real_emulator/
          cp real_logcat_report.html real_logcat_report.json real_dmesg_report.html real_dmesg_report.json reports/
          git add sample_logs/real_emulator reports/real_logcat_report.html reports/real_logcat_report.json reports/real_dmesg_report.html reports/real_dmesg_report.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Add real emulator boot logs collected via ADB in CI (identifier scan clean)"
          git push

      - name: Upload logs and reports
        uses: actions/upload-artifact@v4
        with:
          name: real-emulator-boot-logs
          retention-days: 5
          path: |
            build_info.txt
            real_boot_dmesg.log
            real_boot_logcat.log
            real_logcat_report.json
            real_logcat_report.html
            real_dmesg_report.json
            real_dmesg_report.html
