name: Collect real emulator boot logs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and collect boot logs via ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            date -u > build_info.txt
            adb shell getprop ro.product.model >> build_info.txt
            adb shell getprop ro.build.version.release >> build_info.txt
            adb shell getprop ro.build.fingerprint >> build_info.txt
            adb root
            sleep 5
            adb wait-for-device
            adb shell dmesg > real_boot_dmesg.log
            adb logcat -b all -d -v threadtime > real_boot_logcat.log
            wc -l real_boot_dmesg.log real_boot_logcat.log

      - name: Run analyzer on the real logs
        run: |
          python3 -m bootlog_analyzer real_boot_logcat.log --json real_logcat_report.json --html real_logcat_report.html
          python3 -m bootlog_analyzer real_boot_dmesg.log --json real_dmesg_report.json --html real_dmesg_report.html

      - name: Scan logs for unreviewed identifiers
        run: |
          set +e
          PATTERN='([0-9a-f]{2}:){5}[0-9a-f]{2}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|(^|[^a-z])imei([^a-z]|$)|(^|[^a-z])serialno|(^|[^a-z])password([^a-z]|$)|bearer [A-Za-z0-9._-]+'
          ALLOW='00:00:00:00:00:00|02:00:00:00:00:00|52:54:00:12:34:56|02:15:b2:00:00:[0-9a-f]{2}|ff:ff:ff:ff:ff:ff|--keep-fds=[0-9:]+|@[0-9]+\.[0-9]+-(service|impl)|@zx2c4\.com|@redhat\.com|com\.(android|google)\.[a-z0-9.]+@[0-9]+|hardware\.[a-z0-9.]+@[0-9]|@overlay@|@idmap|apex@|@classes\.(dex|vdex)|dalvik-cache|0@(com\.(android|google)\.|android\.)|data@resource-cache@|ACCESS_GOOGLE_PASSWORD|password complexity|synthetic password|password\.is_some\(\)|stringId=password|x-password|DEVICE_IMEI\s+\[PHONE0\]'
          matches=$(grep -nEi "$PATTERN" real_boot_dmesg.log real_boot_logcat.log | grep -vE "$ALLOW")
          count=$(echo -n "$matches" | grep -c .)
          echo "remaining unreviewed matches: $count"
          echo "=== full remaining list ==="
          echo "$matches"
          echo "=== end of remaining list ==="
          if [ "$count" -ne 0 ]; then
            echo "Unreviewed identifier-like strings found; refusing to commit logs."
            exit 1
          fi

      - name: Commit real logs and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p sample_logs/real_emulator reports
          cp real_boot_dmesg.log real_boot_logcat.log build_info.txt sample_logs/real_emulator/
          cp real_logcat_report.json real_logcat_report.html real_dmesg_report.json real_dmesg_report.html reports/
          git add sample_logs/real_emulator reports
          git commit -m "Add real emulator boot logs and analyzer reports (API 35 google_apis emulator, collected via ADB)"
          git push
