name: Collect real emulator boot logs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and collect boot logs via ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          script: |
            date -u > build_info.txt
            adb shell getprop ro.product.model >> build_info.txt
            adb shell getprop ro.build.version.release >> build_info.txt
            adb shell getprop ro.build.fingerprint >> build_info.txt
            adb root
            sleep 5
            adb wait-for-device
            adb shell dmesg > real_boot_dmesg.log
            adb logcat -b all -d -v threadtime > real_boot_logcat.log
            wc -l real_boot_dmesg.log real_boot_logcat.log

      - name: Run analyzer on the real logs
        run: |
          python3 -m bootlog_analyzer real_boot_logcat.log --json real_logcat_report.json --html real_logcat_report.html
          python3 -m bootlog_analyzer real_boot_dmesg.log --json real_dmesg_report.json --html real_dmesg_report.html

      - name: Verify reviewed identifier allowlist (no commit in this run)
        run: |
          set +e
          PATTERN='([0-9a-f]{2}:){5}[0-9a-f]{2}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|(^|[^a-z])imei([^a-z]|$)|(^|[^a-z])serialno|(^|[^a-z])password([^a-z]|$)|bearer [A-Za-z0-9._-]+'
          ALLOW='02:00:00:00:00:00|52:54:00:12:34:56|02:15:b2:00:00:01|ff:ff:ff:ff:ff:ff|@[0-9]+\.[0-9]+-(service|impl)|@zx2c4\.com|@redhat\.com|com\.(android|google)\.[a-z0-9.]+@[0-9]+|hardware\.[a-z0-9.]+@[0-9]|@overlay@|\.apk@idmap|apex@|@classes\.(dex|vdex)|dalvik-cache'
          matches=$(grep -nEi "$PATTERN" real_boot_dmesg.log real_boot_logcat.log | grep -vE "$ALLOW")
          count=$(echo -n "$matches" | grep -c .)
          echo "remaining unreviewed matches: $count"
          echo "=== full remaining list ==="
          echo "$matches"
          echo "=== end of remaining list ==="
